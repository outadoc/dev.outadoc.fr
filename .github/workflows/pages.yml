name: Pages

on:
  push:
    branches:
      - develop
    paths:
      - static/**
      - .github/workflows/pages.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a deployment in progress finish, but skip queued ones in favor of the latest
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: static

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: static
          bundler-cache: true

      - uses: actions/configure-pages@v6

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links and images
        run: bundle exec htmlproofer _site --disable-external --ignore-missing-alt --checks Links,Images,Scripts --no-enforce-https --allow-missing-href

      - uses: actions/upload-pages-artifact@v5
        with:
          path: static/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
