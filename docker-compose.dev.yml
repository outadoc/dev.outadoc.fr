version: "3"

services:
  web:
    build: .
    container_name: outadev_web
    restart: unless-stopped
    ports:
      - 8083:80
    environment:
      DATABASE_URL: mysql://dev:S3NSxRn7TEkGKyrJ@db:3306/dev
    volumes:
      - dev-image-data:/var/www/html/public/assets/img/data
    links:
      - db

  db:
    image: mariadb:10.5
    container_name: outadev_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: S3NSxRn7TEkGKyrJ
      MYSQL_RANDOM_ROOT_PASSWORD: "1"

volumes:
  dev-image-data:
