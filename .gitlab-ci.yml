variables:
  SYMFONY_ENV: prod

before_script:
  - cp /var/www/vhosts/dev.outadoc.fr/parameters.yml app/config/parameters.yml
  - composer install --no-progress --no-dev --optimize-autoloader
  - sudo rm -rf /var/cache/dev.outadoc.fr/prod/* || true

stages:
  - check
  - deploy

check:
    stage: check
    script:
    - bin/symfony_requirements
    tags: 
    - php

deploy:
  stage: deploy
  script:
  - bin/console doctrine:database:drop --if-exists --force --env=prod --no-debug
  - bin/console doctrine:database:create --env=prod --no-debug
  - bin/console doctrine:schema:create --env=prod --no-debug || true
  - bin/console doctrine:database:import database_data.sql --env=prod --no-debug
  - rm web/app_dev.php
  - rm web/config.php
  - rm -rf /var/www/vhosts/dev.outadoc.fr/htdocs/*
  - cp -R * /var/www/vhosts/dev.outadoc.fr/htdocs/
  tags: 
  - php
  - mysql
  only:
  - master
